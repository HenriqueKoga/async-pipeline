[project]
name = "async-pipeline"
version = "1.0.0"
description = "Composable async pipelines: sequential stages, hooks, middleware, bounded map, retries, and timeouts."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Henrique Tukahara Koga" }]
keywords = [
    "async",
    "asyncio",
    "composition",
    "middleware",
    "pipeline",
    "typing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/HenriqueKoga/async-pipeline"
Repository = "https://github.com/HenriqueKoga/async-pipeline"
Issues = "https://github.com/HenriqueKoga/async-pipeline/issues"
Changelog = "https://github.com/HenriqueKoga/async-pipeline/blob/master/CHANGELOG.md"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.41.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
    "src/async_pipeline",
    "examples",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "opentelemetry-api>=1.41.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["async_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
