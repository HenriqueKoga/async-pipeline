name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync

      - name: pytest
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src
